DirContent:
  type: object
  properties:
    entries:
      type: array
      items:
        $ref: "#/DirEntry"

DirEntry:
  type: object
  properties:
    inodeID:
      type: string
    name:
      type: string
    type:
      type: string

ObjectContent:
  type: object
  required: [bucket, key]
  properties:
    bucket:
      type: string
    key:
      type: string
    contentType:
      type: string
    checksum:
      type: string
