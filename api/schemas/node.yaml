DirContent:
  type: object
  properties:
    entries:
      type: array
      items:
        $ref: "#/DirEntry"

DirEntry:
  type: object
  properties:
    inodeID:
      type: string
    name:
      type: string
    kind:
      type: string

ObjectContent:
  type: object
  required: [bucket, key]
  properties:
    bucket:
      type: string
    key:
      type: string
    contentType:
      type: string
    checksum:
      type: string

NodeStat:
  type: object
  description: |
    Inode metadata. Permission checks are not modeled here:
    OpenFGA owns access control across drives, and S3 (where
    applicable) owns per-object ACLs.
  required: [type, size, nlink, ino, atime, mtime, ctime, crtime]
  properties:
    type:
      type: string
    size:
      type: integer
      format: int64
    nlink:
      type: integer
      format: uint32
      description: POSIX st_nlink (hardlink count). Unsigned 32-bit to match the internal representation.
    ino:
      type: string
      format: uuid
      description: POSIX st_ino (inode id).
    atime:
      type: string
      format: date-time
      description: POSIX st_atime.
    mtime:
      type: string
      format: date-time
      description: POSIX st_mtime.
    ctime:
      type: string
      format: date-time
      description: POSIX st_ctime (inode change time, not creation).
    crtime:
      type: string
      format: date-time
      description: Creation time (ext4 st_crtime).
    flags:
      type: string
      description: ext4-style i_flags bitmask (hex).
    revision:
      type: string
      description: Internal revision token (ULID) for optimistic concurrency.
