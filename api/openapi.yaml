openapi: 3.1.0
info:
  title: mdrive API
  version: 0.1.0
  description: POSIX-like file system API over S3

servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://api.mdrive.mandacode.com
    description: Production server

security:
  - bearerAuth: []

paths:
  /health:
    $ref: "./endpoints/health.yaml#/health"

  /v1/drives:
    $ref: "./endpoints/drive.yaml#/drives"

  /v1/drives/{driveID}/root:
    $ref: "./endpoints/drive.yaml#/drive"

  /v1/drives/{driveID}/restore:
    $ref: "./endpoints/drive.yaml#/restoreDrive"

  /v1/admin/drives/deleted:
    $ref: "./endpoints/drive.yaml#/adminDrives"

  /v1/drives/{driveID}/storage:
    $ref: "./endpoints/drive.yaml#/storage"

  /v1/drives/{driveID}/fs/mkdir:
    $ref: "./endpoints/fs.yaml#/mkdir"

  /v1/drives/{driveID}/fs/touch:
    $ref: "./endpoints/fs.yaml#/touch"

  /v1/drives/{driveID}/fs:
    $ref: "./endpoints/fs.yaml#/rm"

  /v1/drives/{driveID}/fs/mv:
    $ref: "./endpoints/fs.yaml#/mv"

  /v1/drives/{driveID}/fs/ls:
    $ref: "./endpoints/fs.yaml#/ls"

  /v1/drives/{driveID}/fs/cat:
    $ref: "./endpoints/fs.yaml#/cat"

  /v1/drives/{driveID}/fs/write:
    $ref: "./endpoints/fs.yaml#/write"

  /v1/drives/{driveID}/fs/symlink:
    $ref: "./endpoints/fs.yaml#/symlink"

  /v1/drives/{driveID}/fs/hardlink:
    $ref: "./endpoints/fs.yaml#/hardlink"

  /v1/drives/{driveID}/fs/mount:
    $ref: "./endpoints/fs.yaml#/mount"

  /v1/drives/{driveID}/fs/unmount:
    $ref: "./endpoints/fs.yaml#/unmount"

  /v1/drives/{driveID}/fs/stat:
    $ref: "./endpoints/fs.yaml#/stat"

  /v1/drives/{driveID}/fs/lstat:
    $ref: "./endpoints/fs.yaml#/lstat"

  /v1/drives/{driveID}/fs/readlink:
    $ref: "./endpoints/fs.yaml#/readlink"

  /v1/drives/{driveID}/fs/object:
    $ref: "./endpoints/fs.yaml#/object"

  /v1/drives/{driveID}/uploads:
    $ref: "./endpoints/upload.yaml#/upload"

  /v1/drives/{driveID}/uploads/{uploadId}/complete:
    $ref: "./endpoints/upload.yaml#/uploadComplete"

  /v1/drives/{driveID}/downloads:
    $ref: "./endpoints/upload.yaml#/download"

  /v1/users:
    $ref: "./endpoints/user.yaml#/users"

  /auth/google:
    $ref: "./endpoints/auth.yaml#/google"

  /auth/google/native:
    $ref: "./endpoints/auth.yaml#/googleNative"

  /auth/callback:
    $ref: "./endpoints/auth.yaml#/callback"

  /auth/logout:
    $ref: "./endpoints/auth.yaml#/logout"

  /auth/me:
    $ref: "./endpoints/auth.yaml#/me"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      $ref: "./schemas/common.yaml#/Error"
    Drive:
      $ref: "./schemas/drive.yaml#/Drive"
    DriveCreate:
      $ref: "./schemas/drive.yaml#/DriveCreate"
    DriveUpdate:
      $ref: "./schemas/drive.yaml#/DriveUpdate"
    StorageConfig:
      $ref: "./schemas/drive.yaml#/StorageConfig"
    DirContent:
      $ref: "./schemas/node.yaml#/DirContent"
    DirEntry:
      $ref: "./schemas/node.yaml#/DirEntry"
    ObjectContent:
      $ref: "./schemas/node.yaml#/ObjectContent"
    NodeStat:
      $ref: "./schemas/node.yaml#/NodeStat"
    PresignRequest:
      $ref: "./schemas/upload.yaml#/PresignRequest"
    PresignResponse:
      $ref: "./schemas/upload.yaml#/PresignResponse"
    UploadCompleteRequest:
      $ref: "./schemas/upload.yaml#/UploadCompleteRequest"
    UploadCompleteResponse:
      $ref: "./schemas/upload.yaml#/UploadCompleteResponse"
    DownloadResponse:
      $ref: "./schemas/upload.yaml#/DownloadResponse"
    User:
      $ref: "./schemas/user.yaml#/User"
