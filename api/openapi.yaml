openapi: 3.1.0
info:
  title: mdrive API
  version: 0.1.0
  description: POSIX-like file system API over S3

servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://api.mdrive.mandacode.com
    description: Production server

# Global security is intentionally NOT set. Each protected
# endpoint declares its own `security: [bearerAuth: []]` block,
# while public endpoints (/health) declare `security: []` to opt
# out. This is the only way ogen honors a public endpoint: it
# generates a security check for every operation that has the
# global security applied, regardless of the endpoint-level
# `security: []` override.

tags:
  - name: health
    description: Service health and readiness probes.
  - name: auth
    description: Session lookup (login/logout/callback are handled by auth middleware, not exposed via this spec).
  - name: drives
    description: Drive CRUD and storage configuration.
  - name: fs
    description: POSIX-like filesystem operations on a drive.
  - name: uploads
    description: Presigned S3 upload lifecycle.
  - name: users
    description: User upsert and lookup.
  - name: admin
    description: Admin-only endpoints.

paths:
  /health:
    x-ogen-operation-group: Health
    $ref: "./endpoints/health.yaml#/health"

  /v1/drives:
    x-ogen-operation-group: Drive
    $ref: "./endpoints/drive.yaml#/drives"

  /v1/drives/{driveID}/root:
    x-ogen-operation-group: Drive
    $ref: "./endpoints/drive.yaml#/drive"

  /v1/drives/{driveID}/restore:
    x-ogen-operation-group: Drive
    $ref: "./endpoints/drive.yaml#/restoreDrive"

  /v1/admin/drives/deleted:
    x-ogen-operation-group: Drive
    $ref: "./endpoints/drive.yaml#/adminDrives"

  /v1/drives/{driveID}/storage:
    x-ogen-operation-group: Drive
    $ref: "./endpoints/drive.yaml#/storage"

  /v1/drives/{driveID}/fs/mkdir:
    x-ogen-operation-group: Fs
    $ref: "./endpoints/fs.yaml#/mkdir"

  /v1/drives/{driveID}/fs/touch:
    x-ogen-operation-group: Fs
    $ref: "./endpoints/fs.yaml#/touch"

  /v1/drives/{driveID}/fs:
    x-ogen-operation-group: Fs
    $ref: "./endpoints/fs.yaml#/rm"

  /v1/drives/{driveID}/fs/mv:
    x-ogen-operation-group: Fs
    $ref: "./endpoints/fs.yaml#/mv"

  /v1/drives/{driveID}/fs/ls:
    x-ogen-operation-group: Fs
    $ref: "./endpoints/fs.yaml#/ls"

  /v1/drives/{driveID}/fs/cat:
    x-ogen-operation-group: Fs
    $ref: "./endpoints/fs.yaml#/cat"

  /v1/drives/{driveID}/fs/write:
    x-ogen-operation-group: Fs
    $ref: "./endpoints/fs.yaml#/write"

  /v1/drives/{driveID}/fs/symlink:
    x-ogen-operation-group: Fs
    $ref: "./endpoints/fs.yaml#/symlink"

  /v1/drives/{driveID}/fs/hardlink:
    x-ogen-operation-group: Fs
    $ref: "./endpoints/fs.yaml#/hardlink"

  /v1/drives/{driveID}/fs/mount:
    x-ogen-operation-group: Fs
    $ref: "./endpoints/fs.yaml#/mount"

  /v1/drives/{driveID}/fs/unmount:
    x-ogen-operation-group: Fs
    $ref: "./endpoints/fs.yaml#/unmount"

  /v1/drives/{driveID}/fs/stat:
    x-ogen-operation-group: Fs
    $ref: "./endpoints/fs.yaml#/stat"

  /v1/drives/{driveID}/fs/lstat:
    x-ogen-operation-group: Fs
    $ref: "./endpoints/fs.yaml#/lstat"

  /v1/drives/{driveID}/fs/readlink:
    x-ogen-operation-group: Fs
    $ref: "./endpoints/fs.yaml#/readlink"

  /v1/drives/{driveID}/fs/realpath:
    x-ogen-operation-group: Fs
    $ref: "./endpoints/fs.yaml#/realpath"

  /v1/drives/{driveID}/fs/object:
    x-ogen-operation-group: Fs
    $ref: "./endpoints/fs.yaml#/object"

  /v1/drives/{driveID}/uploads:
    x-ogen-operation-group: Upload
    $ref: "./endpoints/upload.yaml#/upload"

  /v1/drives/{driveID}/uploads/{uploadId}/complete:
    x-ogen-operation-group: Upload
    $ref: "./endpoints/upload.yaml#/uploadComplete"

  /v1/drives/{driveID}/downloads:
    x-ogen-operation-group: Upload
    $ref: "./endpoints/upload.yaml#/download"

  /v1/users:
    x-ogen-operation-group: User
    $ref: "./endpoints/user.yaml#/users"

  /auth/login:
    x-ogen-operation-group: Auth
    $ref: "./endpoints/auth.yaml#/login"

  /auth/callback:
    x-ogen-operation-group: Auth
    $ref: "./endpoints/auth.yaml#/callback"

  /auth/logout:
    x-ogen-operation-group: Auth
    $ref: "./endpoints/auth.yaml#/logout"

  /auth/me:
    x-ogen-operation-group: Auth
    $ref: "./endpoints/auth.yaml#/me"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid request payload or path.
      content:
        application/json:
          schema:
            $ref: "./schemas/common.yaml#/Error"
    Unauthorized:
      description: Missing or invalid session cookie.
      content:
        application/json:
          schema:
            $ref: "./schemas/common.yaml#/Error"
    Forbidden:
      description: Authenticated but lacks the required permission.
      content:
        application/json:
          schema:
            $ref: "./schemas/common.yaml#/Error"
    NotFound:
      description: Resource does not exist.
      content:
        application/json:
          schema:
            $ref: "./schemas/common.yaml#/Error"
    Conflict:
      description: Resource already exists, soft-deleted, or version conflict.
      content:
        application/json:
          schema:
            $ref: "./schemas/common.yaml#/Error"
    UnprocessableEntity:
      description: Request understood but cannot be processed (e.g. wrong node type, hardlink source not a file).
      content:
        application/json:
          schema:
            $ref: "./schemas/common.yaml#/Error"
    ServiceUnavailable:
      description: A required backend is unreachable. Returned by /health when degraded.
      content:
        application/json:
          schema:
            $ref: "./schemas/common.yaml#/Error"
    UnexpectedError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "./schemas/common.yaml#/Error"

  schemas:
    Error:
      $ref: "./schemas/common.yaml#/Error"
    Drive:
      $ref: "./schemas/drive.yaml#/Drive"
    DriveCreate:
      $ref: "./schemas/drive.yaml#/DriveCreate"
    DriveUpdate:
      $ref: "./schemas/drive.yaml#/DriveUpdate"
    StorageConfig:
      $ref: "./schemas/drive.yaml#/StorageConfig"
    DirContent:
      $ref: "./schemas/node.yaml#/DirContent"
    DirEntry:
      $ref: "./schemas/node.yaml#/DirEntry"
    ObjectContent:
      $ref: "./schemas/node.yaml#/ObjectContent"
    NodeStat:
      $ref: "./schemas/node.yaml#/NodeStat"
    PresignRequest:
      $ref: "./schemas/upload.yaml#/PresignRequest"
    PresignResponse:
      $ref: "./schemas/upload.yaml#/PresignResponse"
    UploadCompleteRequest:
      $ref: "./schemas/upload.yaml#/UploadCompleteRequest"
    UploadCompleteResponse:
      $ref: "./schemas/upload.yaml#/UploadCompleteResponse"
    DownloadResponse:
      $ref: "./schemas/upload.yaml#/DownloadResponse"
    User:
      $ref: "./schemas/user.yaml#/User"
