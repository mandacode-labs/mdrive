google:
  get:
    operationId: googleLogin
    summary: Initiate Google OAuth login (web)
    security: []
    responses:
      "302":
        description: Redirect to Zitadel with idp_id=google
        headers:
          Location:
            schema: { type: string }
            required: true

googleNative:
  post:
    operationId: googleNativeLogin
    summary: Exchange a Google id_token for a mdrive session (mobile)
    security: []
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [idToken]
            properties:
              idToken: { type: string }
    responses:
      "200":
        description: Session created
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                user:
                  $ref: "../openapi.yaml#/components/schemas/User"
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

callback:
  get:
    operationId: authCallback
    summary: OAuth callback from Zitadel
    security: []
    parameters:
      - name: code
        in: query
        required: true
        schema: { type: string }
      - name: state
        in: query
        required: true
        schema: { type: string }
    responses:
      "302":
        description: Redirect to frontend with session cookie set
        headers:
          Location:
            schema: { type: string }
            required: true
          Set-Cookie:
            schema: { type: string }
            required: true
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

logout:
  post:
    operationId: authLogout
    summary: Destroy the current session
    responses:
      "204":
        description: Session destroyed
        headers:
          Set-Cookie:
            schema: { type: string }
            required: true
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

me:
  get:
    operationId: authMe
    summary: Get the current authenticated user
    responses:
      "200":
        description: Current user
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/User"
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
