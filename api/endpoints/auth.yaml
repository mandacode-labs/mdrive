google:
  get:
    operationId: googleLogin
    tags:
      - auth
    description: |
      Start Google OIDC login (browser redirect).
    summary: Initiate Google OAuth login (web)
    security: []
    responses:
      "302":
        description: Redirect to Zitadel with idp_id=google
        headers:
          Location:
            schema: { type: string }
            required: true

googleNative:
  post:
    operationId: googleNativeLogin
    tags:
      - auth
    description: |
      Native Google OIDC login. Exchanges the ID token for a session cookie.
    summary: Exchange a Google id_token for a mdrive session (mobile)
    security: []
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [idToken]
            properties:
              idToken: { type: string }
    responses:
      "200":
        description: Session created
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                user:
                  $ref: "../openapi.yaml#/components/schemas/User"
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

callback:
  get:
    operationId: authCallback
    tags:
      - auth
    description: |
      OIDC redirect target. Exchanges the authorization code for tokens and starts a session.
    summary: OAuth callback from Zitadel
    security: []
    parameters:
      - name: code
        in: query
        required: true
        schema: { type: string }
      - name: state
        in: query
        required: true
        schema: { type: string }
    responses:
      "302":
        description: Redirect to frontend with session cookie set
        headers:
          Location:
            schema: { type: string }
            required: true
          Set-Cookie:
            schema: { type: string }
            required: true
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

logout:
  post:
    operationId: authLogout
    tags:
      - auth
    description: |
      Invalidate the current session. Sets the session cookie to expired.
    summary: Destroy the current session
    responses:
      "204":
        description: Session destroyed
        headers:
          Set-Cookie:
            schema: { type: string }
            required: true
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

me:
  get:
    operationId: authMe
    tags:
      - auth
    description: |
      Return the current authenticated user (200) or 401 if no session.
    summary: Get the current authenticated user
    responses:
      "200":
        description: Current user
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/User"
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
