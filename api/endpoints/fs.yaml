mkdir:
  post:
    operationId: mkdir
    tags:
      - fs
    description: |
      Create a directory at `path` in the drive. Returns 409 if `path` already exists.
    summary: Create a directory (POSIX mkdir(2))
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [path]
            properties:
              path:
                type: string
    responses:
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../openapi.yaml#/components/responses/Conflict"
      "422":
        $ref: "../openapi.yaml#/components/responses/UnprocessableEntity"
      "200":
        description: Directory created
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

touch:
  post:
    operationId: touch
    tags:
      - fs
    description: |
      Create an empty regular file at `path`, or update its mtime if it exists.
    summary: Create an empty file (POSIX open(O_CREAT))
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [path]
            properties:
              path:
                type: string
    responses:
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../openapi.yaml#/components/responses/Conflict"
      "422":
        $ref: "../openapi.yaml#/components/responses/UnprocessableEntity"
      "200":
        description: File created
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

rm:
  delete:
    operationId: rm
    tags:
      - fs
    description: |
      Remove one or more filesystem entries. With `recursive=true`, removes directories and their contents.
    summary: Remove files or directories (POSIX unlink/rmdir(2))
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [paths]
            properties:
              paths:
                type: array
                items: { type: string }
              recursive:
                type: boolean
    responses:
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../openapi.yaml#/components/responses/Conflict"
      "422":
        $ref: "../openapi.yaml#/components/responses/UnprocessableEntity"
      "204":
        description: Deleted
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

mv:
  post:
    operationId: mv
    tags:
      - fs
    description: |
      Move or rename one or more sources to a destination. Source and destination must be on the same drive.
    summary: Move files or directories (POSIX rename(2))
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [sources, destination]
            properties:
              sources:
                type: array
                items: { type: string }
              destination:
                type: string
    responses:
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../openapi.yaml#/components/responses/Conflict"
      "422":
        $ref: "../openapi.yaml#/components/responses/UnprocessableEntity"
      "200":
        description: Moved
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

ls:
  get:
    operationId: ls
    tags:
      - fs
    description: |
      List the contents of a directory. Each entry returns its name, type, and inode id.
    summary: List directory contents (POSIX opendir/readdir)
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
      - name: path
        in: query
        required: true
        schema:
          type: string
          default: "/"
    responses:
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "422":
        $ref: "../openapi.yaml#/components/responses/UnprocessableEntity"
      "200":
        description: Directory listing
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DirContent"
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

cat:
  get:
    operationId: cat
    tags:
      - fs
    description: |
      Read the file at `path`. Returns 404 if missing, 422 if the path is a directory or symlink target is not a file.
    summary: Read file contents (POSIX open(O_RDONLY))
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
      - name: path
        in: query
        required: true
        schema: { type: string }
    responses:
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "422":
        $ref: "../openapi.yaml#/components/responses/UnprocessableEntity"
      "200":
        description: File content
        content:
          text/plain:
            schema: { type: string }
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

write:
  put:
    operationId: write
    tags:
      - fs
    description: |
      Create or replace the file at `path` with `content`.
    summary: Write inline content to a file
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [path, content]
            properties:
              path: { type: string }
              content: { type: string }
    responses:
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../openapi.yaml#/components/responses/Conflict"
      "422":
        $ref: "../openapi.yaml#/components/responses/UnprocessableEntity"
      "200":
        description: Written
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

readlink:
  get:
    operationId: readlink
    tags:
      - fs
    description: |
      Return the target path of a symlink (POSIX readlink(2)). Returns 422 if the inode is not a symlink.
    summary: Read a symbolic link's target (POSIX readlink(2))
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
      - name: path
        in: query
        required: true
        schema: { type: string }
    responses:
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "422":
        $ref: "../openapi.yaml#/components/responses/UnprocessableEntity"
      "200":
        description: Symlink target
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: { type: string }
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

realpath:
  get:
    operationId: realpath
    tags:
      - fs
    description: |
      Resolve all symlinks and return the canonical absolute path.
    summary: Resolve all symlinks and return the canonical (driveID, path) pair (POSIX realpath(3))
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
      - name: path
        in: query
        required: true
        schema: { type: string }
    responses:
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "422":
        $ref: "../openapi.yaml#/components/responses/UnprocessableEntity"
      "200":
        description: Canonical path
        content:
          application/json:
            schema:
              type: object
              required: [driveID, path]
              properties:
                driveID: { type: string }
                path: { type: string }
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

symlink:
  post:
    operationId: symlink
    tags:
      - fs
    description: |
      Create a symlink at `link_path` with `target` (POSIX symlink(2)). `target` may be absolute or relative; the link may dangle.
    summary: Create a symbolic link (POSIX symlink(2))
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [target, linkPath]
            properties:
              target: { type: string }
              linkPath: { type: string }
    responses:
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../openapi.yaml#/components/responses/Conflict"
      "422":
        $ref: "../openapi.yaml#/components/responses/UnprocessableEntity"
      "200":
        description: Symlink created
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

hardlink:
  post:
    operationId: hardlink
    tags:
      - fs
    description: |
      Create a hardlink to a regular file at `src_path` (POSIX link(2)). Increments the source's nlink. Source must be a regular file (not a directory, symlink, or mount). Same drive only.
    summary: Create a hard link (POSIX link(2))
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [srcPath, linkPath]
            properties:
              srcPath: { type: string }
              linkPath: { type: string }
    responses:
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../openapi.yaml#/components/responses/Conflict"
      "422":
        $ref: "../openapi.yaml#/components/responses/UnprocessableEntity"
      "200":
        description: Hardlink created
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

mount:
  post:
    operationId: mount
    tags:
      - fs
    description: |
      Bind-mount another drive's root at `mount_path` in this drive. Path resolution crosses drives via the mount.
    summary: Bind-mount another drive at a path (POSIX mount-like)
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [mountPath, sourceDriveID]
            properties:
              mountPath: { type: string }
              sourceDriveID: { type: string }
    responses:
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../openapi.yaml#/components/responses/Conflict"
      "422":
        $ref: "../openapi.yaml#/components/responses/UnprocessableEntity"
      "200":
        description: Mount created
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

unmount:
  delete:
    operationId: unmount
    tags:
      - fs
    description: |
      Remove the bind-mount at `mount_path`.
    summary: Remove a bind mount (POSIX umount-like)
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
      - name: mountPath
        in: query
        required: true
        schema: { type: string }
    responses:
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../openapi.yaml#/components/responses/Conflict"
      "422":
        $ref: "../openapi.yaml#/components/responses/UnprocessableEntity"
      "204":
        description: Unmounted
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

stat:
  get:
    operationId: stat
    tags:
      - fs
    description: |
      Return metadata for the file at `path` (POSIX stat(2)). Follows symlinks.
    summary: Get file metadata, following symlinks (POSIX stat(2))
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
      - name: path
        in: query
        required: true
        schema: { type: string }
    responses:
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "422":
        $ref: "../openapi.yaml#/components/responses/UnprocessableEntity"
      "200":
        description: File metadata
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/NodeStat"
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

lstat:
  get:
    operationId: lstat
    tags:
      - fs
    description: |
      Return metadata for the file at `path` (POSIX lstat(2)). Does NOT follow symlinks.
    summary: Get file metadata without following symlinks (POSIX lstat(2))
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
      - name: path
        in: query
        required: true
        schema: { type: string }
    responses:
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "422":
        $ref: "../openapi.yaml#/components/responses/UnprocessableEntity"
      "200":
        description: File metadata (symlink returned as-is)
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/NodeStat"
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

object:
  post:
    operationId: writeLarge
    tags:
      - fs
    description: |
      Create or replace the S3 object at `path` with multipart `object` content.
    summary: Create an S3-backed object node
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [path, object, size]
            properties:
              path: { type: string }
              size: { type: integer, format: int64 }
              object:
                $ref: "../openapi.yaml#/components/schemas/ObjectContent"
    responses:
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "409":
        $ref: "../openapi.yaml#/components/responses/Conflict"
      "422":
        $ref: "../openapi.yaml#/components/responses/UnprocessableEntity"
      "200":
        description: Object node created
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
