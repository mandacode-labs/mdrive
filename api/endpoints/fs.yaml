mkdir:
  post:
    operationId: mkdir
    summary: Create a directory
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [path]
            properties:
              path:
                type: string
    responses:
      "200":
        description: Directory created

touch:
  post:
    operationId: touch
    summary: Create an empty file
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [path]
            properties:
              path:
                type: string
    responses:
      "200":
        description: File created

rm:
  delete:
    operationId: rm
    summary: Remove files or directories
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [paths]
            properties:
              paths:
                type: array
                items: { type: string }
              recursive:
                type: boolean
    responses:
      "204":
        description: Deleted

mv:
  post:
    operationId: mv
    summary: Move files or directories
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [sources, destination]
            properties:
              sources:
                type: array
                items: { type: string }
              destination:
                type: string
    responses:
      "200":
        description: Moved

ls:
  get:
    operationId: ls
    summary: List directory contents
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
      - name: path
        in: query
        required: true
        schema:
          type: string
          default: "/"
    responses:
      "200":
        description: Directory listing
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DirContent"

cat:
  get:
    operationId: cat
    summary: Read file contents
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
      - name: path
        in: query
        required: true
        schema: { type: string }
    responses:
      "200":
        description: File content
        content:
          text/plain:
            schema: { type: string }

write:
  put:
    operationId: write
    summary: Write inline content to a file
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [path, content]
            properties:
              path: { type: string }
              content: { type: string }
    responses:
      "200":
        description: Written

readlink:
  get:
    operationId: readlink
    summary: Read a symbolic link's target (POSIX readlink(2))
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
      - name: path
        in: query
        required: true
        schema: { type: string }
    responses:
      "200":
        description: Symlink target
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: { type: string }

symlink:
  post:
    operationId: symlink
    summary: Create a symbolic link
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [target, linkPath]
            properties:
              target: { type: string }
              linkPath: { type: string }
    responses:
      "200":
        description: Symlink created
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

hardlink:
  post:
    operationId: hardlink
    summary: Create a hard link (POSIX ln(1))
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [srcPath, linkPath]
            properties:
              srcPath: { type: string }
              linkPath: { type: string }
    responses:
      "200":
        description: Hardlink created
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

mount:
  post:
    operationId: mount
    summary: Bind-mount another drive at a path (POSIX mount-like)
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [mountPath, sourceDriveID]
            properties:
              mountPath: { type: string }
              sourceDriveID: { type: string }
    responses:
      "200":
        description: Mount created
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

unmount:
  delete:
    operationId: unmount
    summary: Remove a bind mount (POSIX umount-like)
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
      - name: mountPath
        in: query
        required: true
        schema: { type: string }
    responses:
      "204":
        description: Unmounted
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

stat:
  get:
    operationId: stat
    summary: Get file metadata (follows symlinks, POSIX stat(2))
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
      - name: path
        in: query
        required: true
        schema: { type: string }
    responses:
      "200":
        description: File metadata
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/NodeStat"
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

lstat:
  get:
    operationId: lstat
    summary: Get file metadata without following symlinks (POSIX lstat(2))
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
      - name: path
        in: query
        required: true
        schema: { type: string }
    responses:
      "200":
        description: File metadata (symlink returned as-is)
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/NodeStat"
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

object:
  post:
    operationId: writeLarge
    summary: Create an S3-backed object node
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            type: object
            required: [path, object, size]
            properties:
              path: { type: string }
              size: { type: integer, format: int64 }
              object:
                $ref: "../openapi.yaml#/components/schemas/ObjectContent"
    responses:
      "200":
        description: Object node created
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
