health:
  get:
    operationId: health
    tags:
      - health
    description: |
      Liveness/readiness probe. Returns 200 with `status: ok` when all configured backends respond.
    summary: Health check
    security: []
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
      "503":
        $ref: "../openapi.yaml#/components/responses/ServiceUnavailable"
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
