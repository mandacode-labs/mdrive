drives:
  post:
    operationId: createDrive
    tags:
      - drives
    description: |
      Create a new drive owned by the authenticated user with the given storage configuration.
    summary: Create a new drive
    requestBody:
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/DriveCreate"
    responses:
      "200":
        description: Drive created
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Drive"
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
  get:
    operationId: listDrives
    tags:
      - drives
    description: |
      List drives owned by the authenticated user.
    summary: List drives owned by the authenticated user
    responses:
      "200":
        description: List of drives
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../openapi.yaml#/components/schemas/Drive"
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

drive:
  get:
    operationId: getDrive
    tags:
      - drives
    description: |
      Return the drive identified by `driveID` (404 if not found or not owned by the caller).
    summary: Get a drive by ID
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
    responses:
      "200":
        description: Drive
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Drive"
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
  put:
    operationId: updateDrive
    tags:
      - drives
    description: |
      Update the drive's name and description. Empty fields are left unchanged.
    summary: Update a drive
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/DriveUpdate"
    responses:
      "200":
        description: Updated drive
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Drive"
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
  delete:
    operationId: deleteDrive
    tags:
      - drives
    description: |
      Soft-delete a drive. The row is marked `deleted_at`; an admin can restore it within the retention window.
    summary: Soft-delete a drive
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
    responses:
      "204":
        description: Deleted
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

restoreDrive:
  post:
    operationId: restoreDrive
    tags:
      - admin
    description: |
      Restore a soft-deleted drive. Admin only.
    summary: Restore a soft-deleted drive
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
    responses:
      "200":
        description: Restored drive
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Drive"
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

adminDrives:
  get:
    operationId: listDeletedDrives
    tags:
      - admin
    description: |
      List all soft-deleted drives. Admin only.
    summary: List soft-deleted drives (admin only)
    responses:
      "200":
        description: List of deleted drives
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../openapi.yaml#/components/schemas/Drive"
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

storage:
  get:
    operationId: getDriveStorage
    tags:
      - drives
    description: |
      Return the storage configuration for the drive.
    summary: Get a drive's storage configuration
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
    responses:
      "200":
        description: Storage config
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/StorageConfig"
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
