upload:
  post:
    operationId: initiateUpload
    tags:
      - uploads
    description: |
      Start a presigned S3 upload. Returns the upload id and the URL to PUT the bytes to.
    summary: Initiate a presigned upload
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/PresignRequest"
    responses:
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "200":
        description: Presigned upload URL created
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/PresignResponse"
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

uploadComplete:
  post:
    operationId: completeUpload
    tags:
      - uploads
    description: |
      Mark the upload as complete. Verifies the S3 object exists, creates the inode, and links it into the parent directory.
    summary: Complete a presigned upload and create the object node
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
      - name: uploadId
        in: path
        required: true
        schema: { type: string }
    requestBody:
      content:
        application/json:
          schema:
            $ref: "../openapi.yaml#/components/schemas/UploadCompleteRequest"
    responses:
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "422":
        $ref: "../openapi.yaml#/components/responses/UnprocessableEntity"
      "200":
        description: Object node created
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/UploadCompleteResponse"
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"

download:
  get:
    operationId: presignDownload
    tags:
      - uploads
    description: |
      Generate a presigned GET URL for downloading an existing object.
    summary: Get a presigned download URL for an object node
    parameters:
      - name: driveID
        in: path
        required: true
        schema: { type: string }
      - name: path
        in: query
        required: true
        schema: { type: string }
    responses:
      "400":
        $ref: "../openapi.yaml#/components/responses/BadRequest"
      "401":
        $ref: "../openapi.yaml#/components/responses/Unauthorized"
      "403":
        $ref: "../openapi.yaml#/components/responses/Forbidden"
      "404":
        $ref: "../openapi.yaml#/components/responses/NotFound"
      "200":
        description: Presigned download URL
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/DownloadResponse"
      default:
        description: Unexpected error
        content:
          application/json:
            schema:
              $ref: "../openapi.yaml#/components/schemas/Error"
