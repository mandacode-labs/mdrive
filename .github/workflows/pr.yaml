name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lightweight checks — GitHub-hosted runners
  fmt-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.3"
      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files need formatting:"
            gofmt -l .
            exit 1
          fi

  vet:
    name: Go Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.3"
      - name: Download dependencies
        run: go mod download
      - name: Run go vet
        run: go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.3"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: v2.11.4
          args: --timeout=5m

  openapi-validate:
    name: OpenAPI Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
      - name: Bundle OpenAPI spec
        run: npx @apidevtools/swagger-cli bundle api/openapi.yaml --outfile api/openapi.bundled.json --type json
      - name: Validate OpenAPI spec
        run: npx @apidevtools/swagger-cli validate api/openapi.bundled.json

  goreleaser-check:
    name: GoReleaser Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.3"
      - name: GoReleaser check
        uses: goreleaser/goreleaser-action@v7.2.2
        with:
          version: "~> v2"
          args: check

  hadolint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: build/docker/server.Dockerfile

  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Lint Helm chart
        run: helm lint deployment/charts/retrowin
      - name: Helm Template
        run: helm template retrowin ./deployment/charts/retrowin

  # Heavy tests — ARC (self-hosted) runners
  unit-test:
    name: Unit Tests
    needs: [fmt-check, vet, lint, openapi-validate, goreleaser-check]
    runs-on: dawn-cluster
    container:
      image: golang:1.26.3
    env:
      GOFLAGS: "-buildvcs=false"
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Download dependencies
        run: go mod download
      - name: Run unit tests
        run: make test
      - name: Upload coverage
        uses: codecov/codecov-action@v6.0.1
        if: always()
        with:
          files: cover-unit.out
          fail_ci_if_error: false

  integration-test:
    name: Integration Tests
    needs: [unit-test]
    runs-on: dawn-cluster-dind
    container:
      image: golang:1.26.3
    env:
      GOFLAGS: "-buildvcs=false"
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Download dependencies
        run: go mod download
      - name: Run integration tests
        run: make test-integration
      - name: Upload coverage
        uses: codecov/codecov-action@v6.0.1
        if: always()
        with:
          files: cover-integration.out
          fail_ci_if_error: false

  e2e-test:
    name: E2E Tests
    needs: [unit-test]
    runs-on: dawn-cluster-dind
    container:
      image: golang:1.26.3
    env:
      GOFLAGS: "-buildvcs=false"
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install atlas
        run: curl -sSf https://atlasgo.sh | sh
      - name: Download dependencies
        run: go mod download
      - name: Run e2e tests
        run: make test-e2e
      - name: Upload coverage
        uses: codecov/codecov-action@v6.0.1
        if: always()
        with:
          files: cover-e2e.out
          fail_ci_if_error: false
          flags: e2e

  docker-build:
    name: Docker Build
    needs: [unit-test]
    runs-on: dawn-cluster-dind
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0
      - name: Build Docker image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: build/docker/server.Dockerfile
          push: false
          tags: retrowin-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  kind-test:
    name: Kind Tests
    needs: [docker-build]
    runs-on: dawn-cluster-dind
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.3"
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Download dependencies
        run: go mod download
      - name: Run kind tests
        run: make test-kind
