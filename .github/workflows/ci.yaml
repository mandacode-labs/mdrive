name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  format-checks:
    name: Format & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.3"
          cache: false
      - name: Run format checks
        run: make fmt
      - name: Run go vet
        run: make vet

  lint-checks:
    name: Lint & Validate
    runs-on: ubuntu-latest
    needs: [format-checks]
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.3"
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: latest
          args: --timeout=5m
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24"
      - name: Bundle OpenAPI spec
        run: npx @apidevtools/swagger-cli bundle api/openapi.yaml --outfile api/openapi.bundled.json --type json
      - name: Validate OpenAPI spec
        run: npx @apidevtools/swagger-cli validate api/openapi.bundled.json
      - name: Dockerfile Lint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: build/docker/server.Dockerfile
      - name: Read ATLAS_VERSION
        id: atlas_version
        run: echo "value=$(cat ATLAS_VERSION)" >> "$GITHUB_OUTPUT"
      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0
      - name: Lint Helm chart
        run: helm lint deployment/charts/mdrive
      - name: Helm Template
        run: helm template mdrive ./deployment/charts/mdrive
      - name: GoReleaser check
        uses: goreleaser/goreleaser-action@v7.2.2
        with:
          version: "~> v2"
          args: check

  security-checks:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [format-checks]
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.3"
          cache: false
      - name: Go Security Scan
        uses: securego/gosec@master
        with:
          args: "./..."
      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."

  unit-test:
    name: Unit Tests
    needs: [lint-checks, security-checks]
    runs-on: dawn-cluster
    container:
      image: golang:1.26.3
    env:
      GOFLAGS: "-buildvcs=false"
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Run unit tests
        run: make test
      - name: Upload coverage
        uses: codecov/codecov-action@v7.0.0
        if: always()
        with:
          use_oidc: true
          files: cover-unit.out
          fail_ci_if_error: false

  integration-test:
    name: Integration Tests
    needs: [unit-test]
    runs-on: dawn-cluster-dind
    container:
      image: golang:1.26.3
    env:
      GOFLAGS: "-buildvcs=false"
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Run integration tests
        run: make test-integration
      - name: Upload coverage
        uses: codecov/codecov-action@v7.0.0
        if: always()
        with:
          use_oidc: true
          files: cover-integration.out
          fail_ci_if_error: false

  e2e-test:
    name: E2E Tests
    needs: [integration-test]
    runs-on: dawn-cluster-dind
    container:
      image: golang:1.26.3
    env:
      GOFLAGS: "-buildvcs=false"
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Install atlas
        run: curl -sSf https://atlasgo.sh | sh
      - name: Run e2e tests
        run: make test-e2e
      - name: Upload coverage
        uses: codecov/codecov-action@v7.0.0
        if: always()
        with:
          use_oidc: true
          files: cover-e2e.out
          fail_ci_if_error: false
          flags: e2e

  docker-build:
    name: Docker Build
    needs: [unit-test]
    runs-on: dawn-cluster-dind
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0
      - name: Login to registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build Docker image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: build/docker/server.Dockerfile
          push: false
          tags: mdrive:test
          cache-from: type=registry,ref=${{ vars.REGISTRY }}/${{ vars.REPOSITORY }}/cache:main
          cache-to: type=registry,ref=${{ vars.REGISTRY }}/${{ vars.REPOSITORY }}/cache:main,mode=max
          build-args: |
            ATLAS_VERSION=${{ steps.atlas_version.outputs.value }}

  kind-test:
    name: Kind Tests
    needs: [docker-build]
    runs-on: dawn-cluster-dind
    env:
      DOCKER_CACHE_REF: ${{ vars.REGISTRY }}/${{ vars.REPOSITORY }}/cache:main
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.3"
          cache: false
      - name: Login to registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0
      - name: Install kind
        uses: helm/kind-action@v1.14.0
        with:
          install_only: true
      - name: Run kind tests
        run: go test -v ./test/kind/... -tags kind -timeout 30m
