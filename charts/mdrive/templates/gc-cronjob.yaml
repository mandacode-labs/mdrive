{{- if .Values.gc.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "mdrive.fullname" . }}-gc
  labels:
    {{- include "mdrive.labels" . | nindent 4 }}
  {{- with .Values.gc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  schedule: {{ .Values.gc.schedule | quote }}
  concurrencyPolicy: {{ .Values.gc.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.gc.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.gc.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: {{ .Values.gc.ttlSecondsAfterFinished }}
      backoffLimit: {{ .Values.gc.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.gc.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "mdrive.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "mdrive.serviceAccountName" . }}
          automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: gc
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              image: {{ include "mdrive.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - /app/mdrive
              args:
                - gc
                - run-all
                - --config
                - /app/config/config.yaml
              env:
                - name: DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.database.existingSecret | default (include "mdrive.fullname" .) }}
                      key: {{ .Values.secrets.database.existingSecretKey | default "database-password" }}
                {{- if or .Values.secrets.storage.access_key .Values.secrets.storage.existingSecret }}
                - name: STORAGE_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.storage.existingSecret | default (include "mdrive.fullname" .) }}
                      key: {{ .Values.secrets.storage.existingSecretKeyAccess | default "storage-access-key" }}
                - name: STORAGE_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.storage.existingSecret | default (include "mdrive.fullname" .) }}
                      key: {{ .Values.secrets.storage.existingSecretKeySecret | default "storage-secret-key" }}
                {{- end }}
                {{- if or .Values.secrets.crypto.master_key .Values.secrets.crypto.existingSecret }}
                - name: CRYPTO_MASTER_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.crypto.existingSecret | default (include "mdrive.fullname" .) }}
                      key: {{ .Values.secrets.crypto.existingSecretKey | default "crypto-master-key" }}
                {{- end }}
                {{- with .Values.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              volumeMounts:
                - name: config
                  mountPath: /app/config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                {{- toYaml .Values.gc.resources | nindent 16 }}
          volumes:
            - name: config
              configMap:
                name: {{ include "mdrive.fullname" . }}
            - name: tmp
              emptyDir: {}
{{- end }}
