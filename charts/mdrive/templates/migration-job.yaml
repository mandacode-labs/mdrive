{{- if .Values.migration.enabled -}}
{{- if not .Values.config.database.host -}}
{{- fail "config.database.host is required when migration.enabled is true (the migration Job builds --database-url from this value)" -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mdrive.fullname" . }}-migration-{{ .Release.Revision }}
  labels:
    {{- include "mdrive.labels" . | nindent 4 }}
  {{- with .Values.migration.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "mdrive.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migration
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "mdrive.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /app/mdrive
          args:
            - migrate
            - apply
            - --database-url
            - >-
              postgres://{{ .Values.config.database.user }}:{{ .Values.secrets.database.password }}@{{ .Values.config.database.host }}:{{ .Values.config.database.port }}/{{ .Values.config.database.name }}?sslmode={{ .Values.config.database.sslmode }}
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.database.existingSecret | default (include "mdrive.fullname" .) }}
                  key: {{ .Values.secrets.database.existingSecretKey | default "database-password" }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}